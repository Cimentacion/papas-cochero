const kmS=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*88)*1.25;
function genRoutes(town){

    legs.forEach(l=>{l.dep=t;t+=l.min;l.arr=t;t+=l.wait});

  };

  let best=null;
  for(const n in GEO){if(n===HOME||n===town)continue;const s=stop(n);const v=kmS(F,s)+kmS(s,D);if(v<d*1.7+6&&(!best||v<best.v))best={s,v}}

  if(best)mk(ids[0],`Transbordo en ${best.s.n}`,[F,best.s,D],[rnd(15,40)],rnd(620,655),.8,1.1,-10,`Perdéis el enlace en ${best.s.n}. El siguiente sale en una hora.`,60,`Enlace en ${best.s.n}. Se puede perder.`);

function vehicles(){

  else if(c.story.madre)V.push({id:"mister",n:"Clio de tu madre (conduce ella)",seats:2,type:"coche",driver:null,brk:.03,gasK:.12,mom:1,own:1});

  if((S.reach||0)>=3&&!(S.buses||[]).length)V.push({id:"club",n:"Minibús de segunda mano del club",seats:14,type:"furgo",driver:null,brk:.04,gasK:.3});

const gasCost=v=>v.own?0:Math.max(2,Math.round(v.gasK*Math.max(S.prep.venue.d,2)*2+2));
const vehOk=v=>!((v.type==="vespa"||v.type==="moto")&&S.prep.venue.d>60);
const usable=v=>v.driver==null||S.prep.assign[v.driver]===v.id;
const seatsUsed=v=>Object.entries(S.prep.assign).filter(([id,a])=>a===v.id&&+id!==v.driver).length;
const vehInUse=v=>usable(v)&&(seatsUsed(v)>0||(v.driver!=null&&S.prep.assign[v.driver]===v.id));
const goers=()=>S.players.filter(p=>S.prep.conv[p.id]&&!S.prep.absent[p.id]);
const canWalk=()=>S.prep.venue.d<5;
function bestRoute(){const R=S.prep.routes;if(!R.length)return null;return R.filter(r=>r.arr<=KO).sort((a,b)=>b.rel-a.rel)[0]||R[0]}
function fallbackMode(){if(canWalk())return "pie";const r=bestRoute();return r?"bus:"+r.id:"casa"}
function autoAssign(){
  const P=S.prep;P.assign={};const V=vehicles();
  goers().forEach(p=>{const v=V.find(v=>v.driver===p.id);if(v&&vehOk(v))P.assign[p.id]=v.id});
  goers().filter(p=>!P.assign[p.id]).sort((a,b)=>ovr(b)-ovr(a)).forEach(p=>{
    const v=V.find(v=>vehOk(v)&&usable(v)&&seatsUsed(v)<v.seats);P.assign[p.id]=v?v.id:fallbackMode()});
}
function travelCost(){
  const P=S.prep;let c=0;
  vehicles().forEach(v=>{if(vehInUse(v)&&!v.own&&P.gas[v.id])c+=gasCost(v)});
  P.routes.forEach(r=>{const n=Object.values(P.assign).filter(a=>a==="bus:"+r.id).length;c+=Math.round(n*r.cost*2)});
  return c;
}
function resolveTravel(){
  const P=S.prep,log=[],arrive={},d=P.venue.d;
  const cost=travelCost();ledSync();S.money-=cost;led("Viaje al partido (gasolina y billetes)",-cost);
  const walkLate=Math.max(0,Math.round(d*14)-40),walkEn=-Math.round(d*3);
  const carMin=Math.round(d*1.1+5);
  vehicles().forEach(v=>{
    const members=Object.entries(P.assign).filter(([,a])=>a===v.id).map(([id])=>+id);
    if(!members.length||!usable(v))return;
    const names=members.map(id=>short(pById(id))).join(", ");
    if(!v.own&&!P.gas[v.id]){
      if(canWalk()){log.push(`El ${v.n} no se mueve: sin gasolina pagada no arranca. ${names} van andando.`);members.forEach(id=>arrive[id]={min:walkLate+5,en:walkEn-3})}
      else log.push(`El ${v.n} no se mueve: sin gasolina pagada no arranca. ${names} se quedan en el pueblo.`);
      return;
    }
    let delay=0,en=v.type==="vespa"||v.type==="moto"?-10:v.type==="tractor"?-12:-4;
    if(v.slow){delay=Math.max(0,Math.round(carMin*1.2-20));log.push(`El ${v.n} va a 30 por la cuneta. ${delay?`Llegan con ${delay} minutos de retraso.`:"Llegan justos."}`)}
    if(v.mom){en+=5;log.push("Tu madre conduce a 60 y os reparte un tupper de filetes empanados.")}
    if(Math.random()<v.brk){if(Math.random()<.5){delay+=rnd(15,35);log.push(`Pinchazo en el ${v.n}. Cambian la rueda en la cuneta. Retraso de ${delay} minutos.`)}
      else if(canWalk()){delay+=walkLate+15;log.push(`El ${v.n} se muere a mitad de camino. ${names} siguen andando.`)}
      else{delay=999;log.push(`El ${v.n} se queda tirado en la carretera. ${names} vuelven a Fuentes en la grúa.`)}}
    if((v.type==="vespa"||v.type==="moto")&&Math.random()<.12){delay+=20;S.money-=100;log.push(`Control de la Guardia Civil a la ${v.n}. No tiene seguro. Multa de 100 € y 20 minutos de charla.`)}
    if(delay<999&&!log.some(l=>l.includes(v.n)))log.push(`${v.n}: ${names}. Llegan sin novedad.`);
    members.forEach(id=>arrive[id]={min:delay,en});
  });
  const walkers=Object.entries(P.assign).filter(([,a])=>a==="pie").map(([id])=>+id);
  if(walkers.length){log.push(`Andando: ${walkers.map(id=>short(pById(id))).join(", ")}. ${walkLate?`Llegan ${walkLate} minutos tarde y sudando.`:"Llegan a tiempo, sudando."}`);walkers.forEach(id=>arrive[id]={min:walkLate,en:walkEn})}
  P.routes.forEach(r=>{
    const members=Object.entries(P.assign).filter(([,a])=>a==="bus:"+r.id).map(([id])=>+id);
    if(!members.length)return;
    let delay=Math.max(0,r.arr-KO);
    if(Math.random()>r.rel){log.push(`Bus ${r.id}: ${r.fail}`);delay+=r.fdel}
    else log.push(`Bus ${r.id} (${r.name}): ${members.length} jugadores. Llegan a las ${hhmm(r.arr)}.`);
    members.forEach(id=>{let dl=delay;if(dl<999&&Math.random()<.08){dl+=35;log.push(`${short(pById(id))} se queda dormido en el bus y se pasa de parada. Vuelve haciendo autostop.`)}arrive[id]={min:dl,en:r.fat}});
  });
  goers().forEach(p=>{if(p.trait==="noche"&&arrive[p.id])arrive[p.id].en-=15});
  return{log,arrive,cost};
}

function power(list,form,o){

const PRESS=["Presión baja","Normal","Presión alta"],STYLE=["Mixto","Contraataque","Posesión","Por bandas"];
function tac(){S.tac=S.tac||{press:1,style:0,mark:false};return S.tac}
function tacMods(oppStr,usStr,form,list){
  if(!unl("tac"))return{a:1,d:1,drain:0,opp:1};const t=tac();let a=1,d=1,drain=0,opp=1;
  if(t.press===2){a*=1.04;d*=1.02;drain+=.08}else if(t.press===0){a*=.96;d*=1.05;drain-=.04}

}

/* ---------- calendario ---------- */
function olRR(n,two){const N=n%2?n+1:n;const t=[...Array(N).keys()];const out=[];
  for(let r=0;r<N-1;r++){const m=[];for(let i=0;i<N/2;i++){let a=t[i],b=t[N-1-i];if((i===0&&r%2)||(i>0&&i%2))[a,b]=[b,a];m.push([a>=n?-1:a,b>=n?-1:b])}out.push(m);t.splice(1,0,t.pop())}
  return two?out.concat(out.map(r=>r.map(([a,b])=>[b,a]))):out}
const olRound=(L,r)=>String(arr(L.fx)[r]||"").split(",").filter(Boolean).map(s=>s.split("_").map(Number));
const olTeams=L=>arr(L.teams);
const olMyIdx=L=>olTeams(L).findIndex(t=>t.u===olMe());
function olTable(L){
  const T=olTeams(L).map((t,i)=>({i,n:t.n,u:t.u,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));
  const R=L.res||{};Object.keys(R).forEach(k=>{const x=R[k];if(!x||x.bye)return;const[r,i]=k.split("_").map(Number);const m=olRound(L,r)[i];if(!m)return;const[a,b]=m;const A=T[a],B=T[b];if(!A||!B)return;
    A.pj++;B.pj++;A.gf+=x.a;A.gc+=x.b;B.gf+=x.b;B.gc+=x.a;if(x.a>x.b){A.g++;B.p++;A.pts+=3}else if(x.a<x.b){B.g++;A.p++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
  return T.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.i-b.i)}
const olJoinWin=L=>Math.max(L.wait||60,240)*1000;
function olPoisR(R,l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L&&k<12);return k-1}
function olSim(lid,L,r,i){
  const T=olTeams(L),[a,b]=olRound(L,r)[i];const R=seeded(hashStr(lid+"_"+r+"_"+i));const sa=T[a].str||14,sb=T[b].str||14;
  const ga=olPoisR(R,1.3*Math.pow(sa/sb,1.3)),gb=olPoisR(R,1.15*Math.pow(sb/sa,1.3));
  const sc=(t,n)=>{const ro=arr(t.ro);const out=[];for(let k=0;k<n;k++){if(!ro.length)break;let w=0;const ws=ro.map(p=>{const x={DEL:5,MED:2.5,DEF:.7,POR:.05}[p.pos]||1;w+=x;return x});let q=R()*w,j=0;while(q>ws[j]&&j<ws.length-1){q-=ws[j];j++}out.push(ro[j].n)}return out};
  return{a:ga,b:gb,sa:sc(T[a],ga),sb:sc(T[b],gb),au:1,t:TS}}
const olHumanT=(L,i)=>{const t=olTeams(L)[i];return t&&t.u?t:null};
async function olAdvance(lid,L){
  if(!L||L.st!=="run")return;const FX=arr(L.fx),r=L.r||0;if(r>=FX.length)return;
  if(olNow()<(L.rt||0))return;
  const ms=olRound(L,r);let all=true,lastT=typeof L.rt==="number"?L.rt:0;const w={};
  ms.forEach(([a,b],i)=>{const k=r+"_"+i;const x=L.res&&L.res[k];if(x){lastT=Math.max(lastT,typeof x.t==="number"?x.t:0);return}all=false;
    if(a<0||b<0){w[k]={bye:1,t:TS};return}
    const ha=olHumanT(L,a),hb=olHumanT(L,b);
    if(!ha&&!hb){w[k]=olSim(lid,L,r,i);return}
    const lv=(L.live||{})[k]||{};const busy=lv.on&&olNow()-lv.on<60000;
    if(olNow()>(L.rt||0)+olJoinWin(L)&&!busy)w[k]=olSim(lid,L,r,i)});
  if(Object.keys(w).length){const up={};Object.entries(w).forEach(([k,v])=>up["res/"+k]=v);await fbq(`l/${lid}`,"PATCH",up);return}
  if(all){if(r+1<FX.length)await fbq(`l/${lid}`,"PATCH",{r:r+1,rt:lastT+(L.wait||60)*1000});else await fbq(`l/${lid}`,"PATCH",{st:"done",end:lastT})}
}
function olMyMatch(lid,L){
  if(!L||L.st!=="run")return null;const me=olMyIdx(L);if(me<0)return null;const r=L.r||0;if(olNow()<(L.rt||0))return null;
  const ms=olRound(L,r);const i=ms.findIndex(([a,b])=>a===me||b===me);if(i<0)return null;const k=r+"_"+i;if(L.res&&L.res[k])return null;if((olCfg().played||{})[lid+"_"+k])return null;
  const[a,b]=ms[i];if(a<0||b<0)return null;const oi=a===me?b:a;const opp=olTeams(L)[oi];
  if(olNow()>(L.rt||0)+olJoinWin(L)&&!((L.live||{})[k]||{}).on)return null;
  return{lid,L,r,i,k,a,b,home:a===me,oi,opp,human:!!opp.u,me}}
function olPending(){for(const lid of Object.keys(OL.lg)){const m=olMyMatch(lid,OL.lg[lid]);if(m)return m}return null}
