name: Compilar AAB para Google Play

on:
  push:
    branches: [main]
    paths:
      - 'play/index.html'
      - 'android-play/**'
      - '.github/workflows/play-aab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar
        id: build
        continue-on-error: true
        run: |
          mkdir -p android-play/app/src/main/assets
          cp play/index.html android-play/app/src/main/assets/index.html
          V=$(python3 -c "import json;print(json.load(open('play/version.json'))['v'])")
          set -o pipefail
          gradle -p android-play --no-daemon bundleRelease assembleRelease -PpcVersion="$V" 2>&1 | tee build.log

      - name: Subir resultado a la rama play-build
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp android-play/app/build/outputs/bundle/release/*.aab /tmp/out/PapasCochero-unsigned.aab 2>/dev/null || true
          cp android-play/app/build/outputs/apk/release/*.apk /tmp/out/PapasCochero-unsigned.apk 2>/dev/null || true
          echo "${{ steps.build.outcome }} $(date -u +%FT%TZ) ${GITHUB_SHA}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "AAB ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:play-build
